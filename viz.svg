<text x="56.0" y="311.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Round k asks every pair: is i→k→j cheaper than the current i→j? Example: 1→3 is ∞</text>
